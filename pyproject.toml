[project]
name = "aihero-sandbox"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "cai_he", email = "cai.hochoy@gmail.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pyjwt>=2.9,<3.0",
    "uvicorn>=0.32,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "httpx>=0.27,<1.0",
]

[project.scripts]
aihero-sandbox = "todos:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "todos"
module-root = "src/apps"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src/apps"]